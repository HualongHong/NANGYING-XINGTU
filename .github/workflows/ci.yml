name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备 OCR 语言包（跨平台下载 + sha256 钉版）
        run: node scripts/ci-tessdata.mjs

      - name: 契约校验（validate 九重）
        run: node scripts/validate.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建 dist（install-dsh 等脚本消费 dist，测试依赖其存在）
        run: pnpm run build

      - name: 测试 + 反馈闭环监控（失败回注注解）
        run: node scripts/ci-test.mjs
