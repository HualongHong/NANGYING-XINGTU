name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备 OCR 语言包（tessdata 按 .gitignore 不入库，CI 按哈希拉取）
        run: |
          mkdir -p tessdata
          curl -fsSL -o tessdata/chi_sim.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata
          curl -fsSL -o tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          echo "a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730  tessdata/chi_sim.traineddata" | sha256sum -c -
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  tessdata/eng.traineddata" | sha256sum -c -

      - name: 契约校验（validate 九重）
        run: node scripts/validate.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试 + 反馈闭环监控
        run: |
          pnpm test 2>&1 | tee /tmp/test-output.log
          TEST_STATUS=${PIPESTATUS[0]}
          if [ "$TEST_STATUS" -ne 0 ]; then
            grep -E "FAIL|×|Failed Tests|Tests  |Error" /tmp/test-output.log | head -n 25 | sed 's/^/::error::/'
            exit "$TEST_STATUS"
          fi
          node scripts/feedback-loop.mjs
